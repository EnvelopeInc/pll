name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./... -count=1

  fuzz:
    name: Fuzz (30s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fuzz the pacer
        run: go test -run '^$' -fuzz '^FuzzPacer$' -fuzztime 30s .
